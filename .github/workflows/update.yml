name: Update packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test_signing:
        description: Only check that signing works, publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that signing works
        if: ${{ inputs.test_signing }}
        run: node update.js test-signing com.google.firebase.messaging

      - name: Publish new versions
        if: ${{ !inputs.test_signing }}
        run: node update.js

      - name: Save the registry files
        if: ${{ !inputs.test_signing && !cancelled() }}
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Art of Game"
          git config user.email "186954620+ArtOfGameGit@users.noreply.github.com"
          git commit -m "chore: new package versions"
          git push

      # GitHub stops a daily schedule after 60 days without a commit. This keeps it running.
      - name: Keep the schedule alive
        run: gh workflow enable update.yml
